<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournoi de Slots - Menu Principal</title>
    <link rel="icon" type="image/png" href="/fly.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/admin-styles.css">
    <script src="/theme-init.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="/theme-manager.js" defer></script>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Changer de thème">
        <img id="themeIcon" src="/lune.png" alt="Lune" class="theme-icon">
    </button>

    <!-- Menu de sélection du mode -->
    <div class="mode-selection-screen">
        <div class="mode-selection-container">
            <div class="mode-selection-content">
                <h1 class="mode-selection-title">
                    <img src="/sept.png" alt="Slot Machine" width="48" height="48">
                    Tournoi de Slots
                    <img src="/sept.png" alt="Slot Machine" width="48" height="48">
                </h1>

                <div class="mode-cards">
                    <a href="/tournoi" class="mode-card">
                        <div class="mode-card-icon">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                                <path d="M4 22h16"></path>
                                <path d="M10 14.66V17c0 .55.47.98.97 1.21C12.5 18.66 14 18.67 15.03 18.21c.5-.23.97-.66.97-1.21v-2.34"></path>
                                <path d="M18 10a8 8 0 0 0-8-8v0a8 8 0 0 0-8 8v6a4 4 0 0 0 4 4h8a4 4 0 0 0 4-4v-6Z"></path>
                            </svg>
                        </div>
                        <h3 class="mode-card-title">Tournoi</h3>
                        <p class="mode-card-description">Mode compétitif avec gestion de tournoi</p>
                    </a>

                    <a href="/bonus-hunt" class="mode-card">
                        <div class="mode-card-icon">
                            <img src="/bonushuntimage.png" alt="Bonus Hunt">
                        </div>
                        <h3 class="mode-card-title">Bonus-Hunt</h3>
                        <p class="mode-card-description">Tracker de bonus hunt</p>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <div class="legal-notice-icon" id="legalNoticeIcon" style="position: fixed; bottom: 20px; left: 20px; z-index: 51; cursor: pointer;">
        <img src="/about-us.png" alt="Mentions légales" style="width: 40px; height: 40px;">
    </div>
    <div class="legal-notice-slide" id="legalNoticeSlide">
        Site créé avec IA.<br>Appartenant à Redwo.<br>Patouche Lamouche Inc.
    </div>
    <script>
        const legalNoticeIcon = document.getElementById('legalNoticeIcon');
        const legalNoticeSlide = document.getElementById('legalNoticeSlide');
        if (legalNoticeIcon && legalNoticeSlide) {
            legalNoticeIcon.addEventListener('click', (e) => {
                e.stopPropagation();
                legalNoticeSlide.classList.toggle('active');
            });
            document.addEventListener('click', (e) => {
                if (legalNoticeSlide.classList.contains('active')) {
                    if (!legalNoticeSlide.contains(e.target) && !legalNoticeIcon.contains(e.target)) {
                        legalNoticeSlide.classList.remove('active');
                    }
                }
            });
        }
    </script>
</body>
</html>
