[build]
  functions = "netlify/functions"

[functions]
  # Include players.json in function bundle so it can be copied to /tmp
  included_files = ["players.json"]

[[redirects]]
  from = "/api/upload-category-image"
  to = "/.netlify/functions/upload-category-image"
  status = 200

[[redirects]]
  from = "/api/delete-category-image"
  to = "/.netlify/functions/delete-category-image"
  status = 200

[[redirects]]
  from = "/api/add-category"
  to = "/.netlify/functions/add-category"
  status = 200

[[redirects]]
  from = "/api/delete-category"
  to = "/.netlify/functions/delete-category"
  status = 200

[[redirects]]
  from = "/api/add-player"
  to = "/.netlify/functions/add-player"
  status = 200

[[redirects]]
  from = "/api/delete-player"
  to = "/.netlify/functions/delete-player"
  status = 200

[[redirects]]
  from = "/api/save-categories"
  to = "/.netlify/functions/save-categories"
  status = 200

[[redirects]]
  from = "/api/save-players"
  to = "/.netlify/functions/save-players"
  status = 200

[[redirects]]
  from = "/api/admin/login"
  to = "/.netlify/functions/admin-login"
  status = 200

[[redirects]]
  from = "/api/admin/verify"
  to = "/.netlify/functions/admin-verify"
  status = 200

[[redirects]]
  from = "/api/admin/logout"
  to = "/.netlify/functions/admin-logout"
  status = 200

[[redirects]]
  from = "/tournois"
  to = "/tournois.html"
  status = 200

[[redirects]]
  from = "/spectate-tournoi"
  to = "/spectate-tournoi.html"
  status = 200

[[redirects]]
  from = "/tournoi/*"
  to = "/tournoi.html"
  status = 200

[[redirects]]
  from = "/tournoi"
  to = "/tournoi.html"
  status = 200

[[redirects]]
  from = "/bonus-hunt"
  to = "/bonus-hunt.html"
  status = 200

[[redirects]]
  from = "/accueil"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/styles.css"
  to = "/styles.css"
  status = 200

[[redirects]]
  from = "/tournament-app.js"
  to = "/tournament-app.js"
  status = 200

[[redirects]]
  from = "/*.png"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/*.svg"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200